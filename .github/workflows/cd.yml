name: CD

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: stratusti/crm
  DEPLOY_DIR: /var/www/crm

jobs:
  deploy:
    name: Build, Migrate & Deploy
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    environment:
      name: production
      url: https://painel.stratustelecom.com.br/crm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            NEXT_PUBLIC_URL=https://painel.stratustelecom.com.br/crm
          secrets: |
            hugeicons_token=${{ secrets.HUGEICONS_TOKEN }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push scanned image
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker tag "${{ env.IMAGE_NAME }}:scan" "$tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Write production env and compose file
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          mkdir -p "$DEPLOY_DIR"
          printf '%s\n' "$APP_ENV" > "$DEPLOY_DIR/.env"
          chmod 600 "$DEPLOY_DIR/.env"
          cp docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"

      - name: Ensure database is up
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose up -d db

      - name: Wait for postgres
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T db pg_isready > /dev/null 2>&1; then
              echo "Postgres ready"
              exit 0
            fi
            echo "Waiting for postgres... ($i/30)"
            sleep 2
          done
          echo "Postgres failed to become ready"
          exit 1

      - name: Run database migrations
        run: |
          docker run --rm \
            --network crm_default \
            --env-file "$DEPLOY_DIR/.env" \
            "${{ env.IMAGE_NAME }}:scan" \
            pnpm prisma:deploy

      - name: Deploy application
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose pull app
          docker compose up -d
          docker image prune -f

  release:
    name: Tag & Release
    needs: [deploy]
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create CalVer tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TODAY=$(date -u +%Y.%m.%d)
          EXISTING=$(git tag --list "$TODAY" "$TODAY.*" | wc -l)
          if [ "$EXISTING" -eq 0 ]; then TAG="$TODAY"; else TAG="$TODAY.$EXISTING"; fi
          echo "Releasing $TAG at $SHA (existing today: $EXISTING)"
          gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes
